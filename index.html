<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WANINT</title>
    <style>
        /* ==========================================================================
           ★ カスタム設定: 各カードの個別カラー
           ========================================================================== */
        :root {
            /* 左側カード（A / EASY / 選択肢A）の設定 */
            --color-left: #065f46; /* 枠線・ラベル文字色 */
            --bg-left: rgba(236, 253, 245, 0.75); /* 背景色 */
            --glow-left: rgba(77, 255, 166, 0.8); /* 選択時の発光色 */
            /* 右側・中央カード（B / HARD / 選択肢B）の設定 */
            --color-right: #1d4ed8; /* 枠線・ラベル文字色 */
            --bg-right: rgba(239, 246, 255, 0.75); /* 背景色 */
            --glow-right: rgba(77, 166, 255, 0.8); /* 選択時の発光色 */
            /* 3つ目のカード（ジャンルC）の設定 */
            --color-third: #b91c1c; /* 枠線・ラベル文字色 */
            --bg-third: rgba(254, 242, 242, 0.75); /* 背景色 */
            --glow-third: rgba(255, 99, 99, 0.8); /* 選択時の発光色 */
        }
        /* ==========================================================================
           1. 画面全体の基本スタイル
           ========================================================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            cursor: none;
        }
        /* ==========================================================================
           2. 背景メディア（画像・動画）レイアウト
           ========================================================================== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #bg-img {
            z-index: 1;
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        #bg-video {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #bg-video.active {
            opacity: 1;
        }
        .hidden { display: none !important; }

        /* ==========================================================================
           3. UIレイヤー（共通設定）
           ========================================================================== */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 2vh 2vw;
            text-shadow: 0 0.4vh 1.5vh rgba(0, 0, 0, 0.95);
        }
        #black-curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in;
        }
        #black-curtain.active {
            opacity: 1;
        }
        .watermark-logo {
            position: fixed;
            bottom: 0vh;
            right: 0vw;
            height: 8vh;
            max-width: 20vw;
            object-fit: contain;
            z-index: 30;
            pointer-events: none;
        }

        /* --------------------------------------------------------------------------
           ★ ネプリーグ風「正解」演出スタイル
           -------------------------------------------------------------------------- */
        #correct-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 60;
            pointer-events: none;
        }
        .correct-text {
            font-size: 24vh;
            font-weight: 900;
            font-family: 'Arial Black', Impact, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            color: #fff200;
            letter-spacing: 0.12em;
            padding-left: 0.12em;
            -webkit-text-stroke: 0.45vh #b30000;
            text-shadow:
                0 0 1.5vh #ff0000,
                0 0 3vh #ff6600,
                0.6vh 0.6vh 0 #b30000,
                -0.6vh -0.6vh 0 #b30000,
                0.6vh -0.6vh 0 #b30000,
                -0.6vh 0.6vh 0 #b30000,
                1vh 1vh 2vh rgba(0, 0, 0, 0.95);
            transform: scale(0);
            opacity: 0;
        }
        .correct-text.animate-nep {
            animation: nepCorrect 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes nepCorrect {
            0% {
                transform: scale(3.5);
                opacity: 0;
            }
            15% {
                transform: scale(0.95);
                opacity: 1;
            }
            25% {
                transform: scale(1.1);
                opacity: 1;
            }
            35% {
                transform: scale(1.0);
                opacity: 1;
            }
            80% {
                transform: scale(1.0);
                opacity: 1;
            }
            100% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        /* --------------------------------------------------------------------------
           3-1. タイトル画面
           -------------------------------------------------------------------------- */
        .title-logo {
            height: 25vh;
            max-width: 90vw;
            object-fit: contain;
            margin-bottom: 4vh;
        }
        .start-msg {
            font-size: 4vh;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        .fullscreen-guide {
            position: absolute;
            top: 2vh;
            left: 2vw;
            margin: 0;
            font-size: 2.5vh;
            color: #aaa;
            font-weight: bold;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }

        /* --------------------------------------------------------------------------
           3-2. 選択画面（ジャンル / 難易度）
           -------------------------------------------------------------------------- */

            margin-bottom: 5vh;
            letter-spacing: 0.05em;

        }
        .card-container {
            display: flex;
            gap: 3.5vw;
            justify-content: center;
            align-items: center;
            max-width: 92vw;
        }
        .select-card {

            height: 45vh;
            max-width: 40vw;
            max-height: 40vw;
            background: rgba(0, 0, 0, 0.65);
            border: 0.8vh solid #fff;
            border-radius: 3vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10vh;
            font-weight: bold;
            box-shadow: 0 2vh 2.5vh rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
            transition: transform 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
        }
        /* ジャンル選択画面（3枚並び）用のサイズ調整とフォーカス演出 */
        #genre-cards .select-card {
            width: 40vh;
            height: 40vh;
            max-width: 26vw;
            max-height: 26vw;
            opacity: 0.45;
            transform: scale(0.9);
        }
        #genre-cards .select-card.is-focused {
            opacity: 1;
            transform: scale(1.08);
            z-index: 15;
        }
        #genre-cards .select-card.card-left.is-focused {
            box-shadow: 0 0 3.5vh var(--glow-left), 0 2vh 2.5vh rgba(0, 0, 0, 0.9);
        }
        #genre-cards .select-card.card-right.is-focused {
            box-shadow: 0 0 3.5vh var(--glow-right), 0 2vh 2.5vh rgba(0, 0, 0, 0.9);
        }
        #genre-cards .select-card.card-third.is-focused {
            box-shadow: 0 0 3.5vh var(--glow-third), 0 2vh 2.5vh rgba(0, 0, 0, 0.9);
        }
        .key-guide {
            margin-top: 5vh;
            font-size: 3vh;
            font-weight: bold;
            color: #eee;
        }
        /* --------------------------------------------------------------------------
           3-3. クイズ画面スタイル & 演出アニメーション
           -------------------------------------------------------------------------- */
        .quiz-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 5vw;
            box-sizing: border-box;
            position: relative;
        }
        .quiz-question-box {
            background: rgba(0, 0, 0, 0.75);
            border: 0.5vh solid #fff;
            border-radius: 2vh;
            width: 80vw;
            padding: 3vh;
            text-align: center;
            font-size: 5vh;
            font-weight: bold;
            line-height: 1.4;
            box-shadow: 0 1vh 2vh rgba(0, 0, 0, 0.8);
            opacity: 0;
        }
        .quiz-question-box.animate-pop {
            animation: popIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .quiz-countdown {
            font-size: 14vh;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 2vh rgba(255, 0, 0, 0.9), 0 0 4vh rgba(0, 0, 0, 1);
            height: 14vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
        }
        .quiz-countdown.animate-count {
            animation: countPop 0.8s ease-out forwards;
        }
        @keyframes countPop {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(2.4); }
        }
        .quiz-options-container {
            display: flex;
            justify-content: space-between;
            width: 85vw;
            margin-bottom: 11vh;
            opacity: 0;
        }
        .quiz-options-container.animate-fade {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .quiz-option-card {
            width: 38vw;
            min-height: 25vh;
            background: rgba(0, 0, 0, 0.75);
            border: 0.6vh solid #aaa;
            border-radius: 2vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2vh;
            box-sizing: border-box;
        }
        .option-label {
            font-size: 4vh;
            font-weight: bold;
            margin-bottom: 1vh;
        }
        .option-text {
            font-size: 4.5vh;
            font-weight: bold;
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .option-img {
            max-width: 100%;
            max-height: 18vh;
            object-fit: contain;
            border-radius: 1vh;
        }
        /* 各カードのカラー適用クラス */
        .card-left {
            border-color: var(--color-left) !important;
            background-color: var(--bg-left) !important;
        }
        .card-left .option-label {
            color: var(--color-left) !important;
        }
        .card-right {
            border-color: var(--color-right) !important;
            background-color: var(--bg-right) !important;
        }
        .card-right .option-label {
            color: var(--color-right) !important;
        }
        .card-third {
            border-color: var(--color-third) !important;
            background-color: var(--bg-third) !important;
        }
        .card-third .option-label {
            color: var(--color-third) !important;
        }
        /* --------------------------------------------------------------------------
           3-4. インジケーター・ゲームオーバー・クリア画面
           -------------------------------------------------------------------------- */
        .stage-indicator {
            position: absolute;
            bottom: 6vh;
            left: 0vw;
            display: flex;
            gap: 0.4vh;
            background: #1e1f24;
            padding: 0.5vh;
            border-radius: 0.6vh;
            border: 0.3vh solid #3a3c42;
            box-shadow: 0 0.6vh 1.5vh rgba(0, 0, 0, 0.9), inset 0 0.2vh 0.4vh rgba(255, 255, 255, 0.15);
            z-index: 20;
            text-shadow: none;
        }
        .stage-slot {
            width: 5.5vh;
            height: 5.5vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.2vh;
            font-weight: 900;
            font-family: 'Arial Black', Impact, sans-serif;
            border-radius: 0.3vh;
            box-sizing: border-box;
            background: #25272c;
            color: #d6e828;
            box-shadow: inset 0.3vh 0.3vh 0.6vh rgba(0, 0, 0, 0.95);
            text-shadow: 0.1vh 0.1vh 0.2vh rgba(0, 0, 0, 0.8);
        }
        .stage-slot.cleared {
            background: #ff8597;
            color: #c40018;
            box-shadow: 0 0.2vh 0.4vh rgba(0, 0, 0, 0.4), inset 0 0.2vh 0.3vh rgba(255, 255, 255, 0.5);
            text-shadow: none;
        }
        .gameover-title {
            font-size: 13vh;
            color: #ff3333;
            margin-bottom: 4vh;
            letter-spacing: 0.08em;
            font-weight: 900;
        }
        .clear-title {
            font-size: 13vh;
            color: #ffd700;
            margin-bottom: 4vh;
            letter-spacing: 0.08em;
            font-weight: 900;
        }
    </style>
    <script>
        // ==========================================================================
        // 1. 定数・設定データの定義
        // ==========================================================================
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbRsUm7p9ttAa6NSNEM-YIRj9Ah7iv4izikbgCemvecrlIMGMl4H80D3wljAFeFHAdFxAoySIBJCkb/pub?gid=0&single=true&output=csv";
       
        const GENRE_LIST = ["A", "B", "C"];
        const GAME_STATES = {
            TITLE: "TITLE",
            GENRE: "GENRE",
            DIFFICULTY: "DIFFICULTY",
            PROGRESS: "PROGRESS",
            PROGRESS_0: "PROGRESS_0",
            PROGRESS_1: "PROGRESS_1",
            PROGRESS_2: "PROGRESS_2",
            PROGRESS_3: "PROGRESS_3",
            PROGRESS_4: "PROGRESS_4",
            PROGRESS_5: "PROGRESS_5",
            QUESTION: "QUESTION",
            QUESTION_0: "QUESTION_0",
            QUESTION_1: "QUESTION_1",
            QUESTION_2: "QUESTION_2",
            QUESTION_3: "QUESTION_3",
            QUESTION_4: "QUESTION_4",
            TIMEOUT: "TIMEOUT",
            GAMEOVER: "GAMEOVER",
            CLEAR: "CLEAR"
        };
       
        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:       { video: "media/bg-title.mp4", poster: "media/bg-title.JPG", loop: true },
            [GAME_STATES.GENRE]:       { video: "media/bg-title.mp4", poster: "media/bg-title.JPG", loop: true },
            [GAME_STATES.DIFFICULTY]:  { video: "media/bg-title.mp4", poster: "media/bg-title.JPG", loop: true },
            [GAME_STATES.PROGRESS_0]:  { video: "media/bg-progress0.mov", poster: "media/bg-progress0.jpg", loop: false },
            [GAME_STATES.PROGRESS_1]:  {
                loop: false,
                poster_L_correct: "media/bg-progress1-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress1-L-wrong.jpg",
                poster_R_correct: "media/bg-progress1-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress1-R-wrong.jpg",
                video_L_correct:  "media/bg-progress1-L-correct.mov",
                video_L_wrong:    "media/bg-progress1-L-wrong.mov",
                video_R_correct:  "media/bg-progress1-R-correct.mov",
                video_R_wrong:    "media/bg-progress1-R-wrong.mov"
            },
            [GAME_STATES.PROGRESS_2]:  {
                loop: false,
                poster_L_correct: "media/bg-progress2-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress2-L-wrong.jpg",
                poster_R_correct: "media/bg-progress2-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress2-R-wrong.jpg",
                video_L_correct:  "media/bg-progress2-L-correct.mov",
                video_L_wrong:    "media/bg-progress2-L-wrong.mov",
                video_R_correct:  "media/bg-progress2-R-correct.mov",
                video_R_wrong:    "media/bg-progress2-R-wrong.mov"
            },
            [GAME_STATES.PROGRESS_3]:  {
                loop: false,
                poster_L_correct: "media/bg-progress3-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress3-L-wrong.jpg",
                poster_R_correct: "media/bg-progress3-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress3-R-wrong.jpg",
                video_L_correct:  "media/bg-progress3-L-correct.mov",
                video_L_wrong:    "media/bg-progress3-L-wrong.mov",
                video_R_correct:  "media/bg-progress3-R-correct.mov",
                video_R_wrong:    "media/bg-progress3-R-wrong.mov"
            },
            [GAME_STATES.PROGRESS_4]:  {
                loop: false,
                poster_L_correct: "media/bg-progress4-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress4-L-wrong.jpg",
                poster_R_correct: "media/bg-progress4-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress4-R-wrong.jpg",
                video_L_correct:  "media/bg-progress4-L-correct.mov",
                video_L_wrong:    "media/bg-progress4-L-wrong.mov",
                video_R_correct:  "media/bg-progress4-R-correct.mov",
                video_R_wrong:    "media/bg-progress4-R-wrong.mov"
            },
            [GAME_STATES.PROGRESS_5]:  {
                loop: false,
                poster_L_correct: "media/bg-progress5-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress5-L-wrong.jpg",
                poster_R_correct: "media/bg-progress5-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress5-R-wrong.jpg",
                video_L_correct:  "media/bg-progress5-L-correct.mov",
                video_L_wrong:    "media/bg-progress5-L-wrong.mov",
                video_R_correct:  "media/bg-progress5-R-correct.mov",
                video_R_wrong:    "media/bg-progress5-R-wrong.mov"
            },
            [GAME_STATES.QUESTION_0]:  { video: "media/bg-quiz0.mp4", poster: "media/bg-quiz0.jpg", loop: true },
            [GAME_STATES.QUESTION_1]:  { video: "media/bg-quiz1.mp4", poster: "media/bg-quiz1.jpg", loop: true },
            [GAME_STATES.QUESTION_2]:  { video: "media/bg-quiz2.mp4", poster: "media/bg-quiz2.jpg", loop: true },
            [GAME_STATES.QUESTION_3]:  { video: "media/bg-quiz3.mp4", poster: "media/bg-quiz3.jpg", loop: true },
            [GAME_STATES.QUESTION_4]:  { video: "media/bg-quiz4.mp4", poster: "media/bg-quiz4.png", loop: true },
            [GAME_STATES.TIMEOUT]:     { video: "media/bg-gameover.mp4", poster: "media/bg-timeout.png", loop: false },
            [GAME_STATES.GAMEOVER]:    { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.jpg", loop: true },
            [GAME_STATES.CLEAR]:       { video: "media/bg-clear.mp4", poster: "media/bg-clear.jpg", loop: true }
        };

        const correctAudio = new Audio("media/correct.mp3");
       
        // ==========================================================================
        // 2. グローバル変数（システム状態管理）
        // ==========================================================================
        let currentState = GAME_STATES.TITLE;
        let currentMediaVideo = null;
        let isAnimating = false;
        let isGameOverReady = false;
        let gameOverTimerId = null;
        let correctOverlayTimerId = null;
        let currentGenreIndex = 0;
        let selectedGenre = "";
        let selectedDifficulty = "";
        let questionCount = 0;
        let questionDatabase = [];
        let currentQuestion = null;
        let lastAnswerSide = "L";
        let lastAnswerCorrect = true;
        let quizTimerIds = [];

        // ==========================================================================
        // 3. ユーティリティ・システム制御関数
        // ==========================================================================
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
       
        async function fetchQuestions() {
            try {
                const fetchUrl = `${CSV_URL}&_t=${Date.now()}`;
                const response = await fetch(fetchUrl, { cache: "no-store" });
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("問題データの取得に失敗しました:", error);
            }
        }
       
        function normalizeAlpha(str) {
            return str
                .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .toUpperCase()
                .trim();
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            questionDatabase = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(",").map(col => col.trim().replace(/^"|"$/g, ''));
                if (cols.length >= 7) {
                    const genreVal = normalizeAlpha(cols[0]);
                    const diffVal = normalizeAlpha(cols[1]);
                    const stepVal = parseInt(cols[2], 10);
                    const ansVal = normalizeAlpha(cols[6]);
                    if (GENRE_LIST.includes(genreVal) && !isNaN(stepVal)) {
                        questionDatabase.push({
                            genre: genreVal,
                            difficulty: diffVal,
                            step: stepVal,
                            question: cols[3],
                            optionA: cols[4],
                            optionB: cols[5],
                            answer: ansVal
                        });
                    }
                }
            }
        }
       
        function preloadMedia() {
            Object.values(MEDIA_PATHS).forEach(media => {
                Object.values(media).forEach(val => {
                    if (typeof val === "string" && val.length > 0) {
                        if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(val)) {
                            const img = new Image();
                            img.src = val;
                        } else if (/\.(mp4|webm|mov)$/i.test(val)) {
                            const req = new XMLHttpRequest();
                            req.open('GET', val, true);
                            req.responseType = 'blob';
                            req.send();
                        }
                    }
                });
            });
        }
       
        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;
            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");
            let posterSrc = null;
            let videoSrc = null;
           
            if (stateKey.startsWith("PROGRESS_") && stateKey !== GAME_STATES.PROGRESS_0) {
                const branchKey = `${lastAnswerSide}_${lastAnswerCorrect ? "correct" : "wrong"}`;
                posterSrc = media[`poster_${branchKey}`] || media.poster || null;
                videoSrc  = media[`video_${branchKey}`]  || media.video  || null;
            } else {
                posterSrc = media.poster || null;
                videoSrc  = media.video  || null;
            }
            videoElem.loop = media.loop !== false;
            if (videoSrc) {
                imgElem.removeAttribute("src");
                imgElem.style.display = "none";
                const showPosterFallback = () => {
                    videoElem.classList.remove("active");
                    currentMediaVideo = null;
                    if (posterSrc) {
                        imgElem.src = posterSrc;
                        imgElem.style.display = "block";
                    }
                };
                if (currentMediaVideo !== videoSrc) {
                    currentMediaVideo = videoSrc;
                    videoElem.classList.remove("active");
                    videoElem.src = videoSrc;
                   
                    videoElem.onerror = showPosterFallback;
                    const playPromise = videoElem.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            videoElem.classList.add("active");
                        }).catch(() => {
                            showPosterFallback();
                        });
                    }
                }
            } else {
                currentMediaVideo = null;
                videoElem.classList.remove("active");
                videoElem.removeAttribute("src");
                videoElem.load();
                if (posterSrc) {
                    imgElem.src = posterSrc;
                    imgElem.style.display = "block";
                } else {
                    imgElem.removeAttribute("src");
                    imgElem.style.display = "none";
                }
            }
        }

        // ==========================================================================
        // 4. UI・クイズロジック関連関数
        // ==========================================================================
        function showCorrectEffect() {
            const overlay = document.getElementById("correct-overlay");
            const textElem = document.getElementById("correct-text");
            if (!overlay || !textElem) return;

            try {
                correctAudio.currentTime = 0;
                correctAudio.play().catch(() => {});
            } catch (err) {
                console.error("正解音の再生に失敗:", err);
            }

            if (correctOverlayTimerId) {
                clearTimeout(correctOverlayTimerId);
            }

            overlay.classList.remove("hidden");
            textElem.classList.remove("animate-nep");
            void textElem.offsetWidth;
            textElem.classList.add("animate-nep");

            correctOverlayTimerId = setTimeout(() => {
                overlay.classList.add("hidden");
                textElem.classList.remove("animate-nep");
                correctOverlayTimerId = null;
            }, 1800);
        }

        function updateGenreFocus() {
            const genreCards = document.querySelectorAll("#genre-cards .select-card");
            genreCards.forEach((card, idx) => {
                if (idx === currentGenreIndex) {
                    card.classList.add("is-focused");
                } else {
                    card.classList.remove("is-focused");
                }
            });
        }

        function updateStageIndicator() {
            for (let i = 1; i <= 5; i++) {
                const slot = document.getElementById(`stage-slot-${i}`);
                if (!slot) continue;
                if (i <= questionCount) {
                    slot.classList.add("cleared");
                } else {
                    slot.classList.remove("cleared");
                }
            }
        }
       
        function clearQuizTimers() {
            quizTimerIds.forEach(id => clearTimeout(id));
            quizTimerIds = [];
            const countElem = document.getElementById("quiz-countdown");
            if (countElem) {
                countElem.textContent = "";
                countElem.classList.remove("animate-count");
            }
            const curtain = document.getElementById("black-curtain");
            if (curtain && currentState !== GAME_STATES.TIMEOUT) {
                curtain.classList.remove("active");
            }
            const overlay = document.getElementById("correct-overlay");
            if (overlay) {
                overlay.classList.add("hidden");
            }
            if (correctOverlayTimerId) {
                clearTimeout(correctOverlayTimerId);
                correctOverlayTimerId = null;
            }
        }
       
        function showCountdown(num) {
            const countElem = document.getElementById("quiz-countdown");
            if (!countElem) return;
            countElem.textContent = num;
            countElem.classList.remove("animate-count");
            void countElem.offsetWidth;
            countElem.classList.add("animate-count");
        }
       
        function startQuizTimers() {
            clearQuizTimers();
            const countdownValues = [5, 4, 3, 2, 1];
            countdownValues.forEach((val, idx) => {
                const timerId = setTimeout(() => {
                    showCountdown(val);
                }, (2 + idx) * 1000);
                quizTimerIds.push(timerId);
            });
            const timeoutId = setTimeout(() => {
                isAnimating = true;
                const curtain = document.getElementById("black-curtain");
                if (curtain) {
                    curtain.classList.add("active");
                }
                const curtainTimerId = setTimeout(() => {
                    isAnimating = false;
                    clearQuizTimers();
                    changeState(GAME_STATES.TIMEOUT);
                    if (curtain) {
                        curtain.classList.remove("active");
                    }
                }, 450);
                quizTimerIds.push(curtainTimerId);
            }, 7000);
            quizTimerIds.push(timeoutId);
        }
       
        function animateSelection(containerId, cardSelector, selectedIndex, callback) {
            const container = document.getElementById(containerId);
            const cards = container.querySelectorAll(cardSelector);
            if (!cards || cards.length < 2) {
                if (callback) callback();
                return;
            }
            const selectedCard = cards[selectedIndex];
            let highlightColor = "#ffd700";
            let glowColor = "rgba(255, 215, 0, 0.8)";
           
            if (selectedCard.classList.contains('card-left')) {
                highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--color-left').trim();
                glowColor = getComputedStyle(document.documentElement).getPropertyValue('--glow-left').trim();
            } else if (selectedCard.classList.contains('card-right')) {
                highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--color-right').trim();
                glowColor = getComputedStyle(document.documentElement).getPropertyValue('--glow-right').trim();
            } else if (selectedCard.classList.contains('card-third')) {
                highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--color-third').trim();
                glowColor = getComputedStyle(document.documentElement).getPropertyValue('--glow-third').trim();
            }

            cards.forEach((card, idx) => {
                if (idx !== selectedIndex) {
                    card.style.transition = "opacity 0.4s ease, transform 0.4s ease";
                    card.style.opacity = "0";
                    card.style.transform = "scale(0.8)";
                }
            });
           
            const rect = selectedCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            const moveX = screenCenterX - cardCenterX;
            const moveY = screenCenterY - cardCenterY;
           
            selectedCard.style.transition = "transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s, background-color 0.3s, box-shadow 0.3s, opacity 0.3s";
            selectedCard.style.opacity = "1";
            selectedCard.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.2)`;
            selectedCard.style.setProperty("border-color", highlightColor, "important");
            selectedCard.style.backgroundColor = "rgba(255, 255, 255, 0.35)";
            selectedCard.style.boxShadow = `0 0 3vh ${glowColor}`;
            selectedCard.style.zIndex = "20";
           
            setTimeout(() => {
                if (callback) callback();
            }, 1200);
        }
       
        function resetCardStyles() {
            const allCards = document.querySelectorAll(".select-card, .quiz-option-card");
            allCards.forEach(card => {
                card.style.transition = "";
                card.style.opacity = "";
                card.style.transform = "";
                card.style.zIndex = "";
                card.style.removeProperty("border-color");
                card.style.backgroundColor = "";
                card.style.boxShadow = "";
            });
        }
       
        function renderOptionContent(containerElem, value) {
            const imageExtensions = /\.(jpg|jpeg|png|gif|webp|svg)$/i;
            containerElem.innerHTML = "";
            if (imageExtensions.test(value)) {
                const img = document.createElement("img");
                img.src = `media/${value}`;
                img.alt = "選択肢画像";
                img.className = "option-img";
                containerElem.appendChild(img);
            } else {
                containerElem.textContent = value;
            }
        }
       
        function loadQuizData() {
            const currentStep = questionCount + 1;
            const matchingQuestions = questionDatabase.filter(q =>
                q.genre === selectedGenre &&
                q.difficulty === selectedDifficulty &&
                q.step === currentStep
            );
            if (matchingQuestions.length > 0) {
                const randomIndex = Math.floor(Math.random() * matchingQuestions.length);
                currentQuestion = matchingQuestions[randomIndex];
                document.getElementById("quiz-text").textContent = currentQuestion.question;
                renderOptionContent(document.getElementById("opt-a-text"), currentQuestion.optionA);
                renderOptionContent(document.getElementById("opt-b-text"), currentQuestion.optionB);
            } else {
                currentQuestion = null;
                document.getElementById("quiz-text").textContent = "問題が見つかりません";
                renderOptionContent(document.getElementById("opt-a-text"), "---");
                renderOptionContent(document.getElementById("opt-b-text"), "---");
            }
            updateStageIndicator();
        }
       
        function triggerQuizSequence() {
            clearQuizTimers();
            const qBox = document.querySelector(".quiz-question-box");
            const optsContainer = document.querySelector(".quiz-options-container");
            qBox.classList.remove("animate-pop");
            optsContainer.classList.remove("animate-fade");
            isAnimating = true;
            setTimeout(() => {
                qBox.classList.add("animate-pop");
            }, 50);
            setTimeout(() => {
                optsContainer.classList.add("animate-fade");
            }, 1550);
            setTimeout(() => {
                isAnimating = false;
                startQuizTimers();
            }, 2150);
        }
       
        function changeState(newState) {
            clearQuizTimers();
            if (gameOverTimerId) {
                clearTimeout(gameOverTimerId);
                gameOverTimerId = null;
            }
            isGameOverReady = false;
            resetCardStyles();
            let targetState = newState;
            if (newState === GAME_STATES.PROGRESS) {
                const step = Math.min(Math.max(questionCount, 0), 5);
                targetState = GAME_STATES[`PROGRESS_${step}`];
            } else if (newState === GAME_STATES.QUESTION) {
                const step = Math.min(Math.max(questionCount, 0), 4);
                targetState = GAME_STATES[`QUESTION_${step}`];
            }
            currentState = targetState;
            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            playMedia(targetState);

            const watermark = document.getElementById("watermark-logo");
            if (watermark) {
                if (targetState === GAME_STATES.TITLE) {
                    watermark.classList.add("hidden");
                } else {
                    watermark.classList.remove("hidden");
                }
            }

            if (targetState === GAME_STATES.TITLE) {
                fetchQuestions();
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (targetState === GAME_STATES.GENRE) {
                currentGenreIndex = 0;
                updateGenreFocus();
                document.getElementById("ui-genre").classList.remove("hidden");
            } else if (targetState === GAME_STATES.DIFFICULTY) {
                document.getElementById("ui-difficulty").classList.remove("hidden");
            } else if (targetState.startsWith("QUESTION_")) {
                loadQuizData();
                document.getElementById("ui-question").classList.remove("hidden");
                triggerQuizSequence();
            } else if (targetState.startsWith("PROGRESS_") && targetState !== GAME_STATES.PROGRESS_0) {
                // 正解ステート時にネプリーグ風テロップと音声を再生
                if (lastAnswerCorrect) {
                    setTimeout(() => {
                        // 状態がまだPROGRESSのままであることを確認して発火
                        if (currentState.startsWith("PROGRESS_")) {
                            showCorrectEffect();
                        }
                    }, 5000);
                }
            } else if (targetState === GAME_STATES.GAMEOVER) {
                gameOverTimerId = setTimeout(() => {
                    const goUi = document.getElementById("ui-gameover");
                    if (goUi && currentState === GAME_STATES.GAMEOVER) {
                        goUi.classList.remove("hidden");
                        isGameOverReady = true;
                    }
                }, 3000);
            } else if (targetState === GAME_STATES.CLEAR) {
                document.getElementById("ui-clear").classList.remove("hidden");
            }
        }

        function handleAnswerSubmit(userChoice) {
            clearQuizTimers();
            const side = userChoice.toUpperCase() === "A" ? "L" : "R";
            let isCorrect = false;
            if (!currentQuestion || !currentQuestion.answer) {
                isCorrect = true;
            } else if (userChoice.toUpperCase() === currentQuestion.answer.toUpperCase()) {
                isCorrect = true;
            }
            lastAnswerSide = side;
            lastAnswerCorrect = isCorrect;
            questionCount++;
            changeState(GAME_STATES.PROGRESS);
        }
       
        // ==========================================================================
        // 5. イベントリスナー（キーボード入力制御）
        // ==========================================================================
        document.addEventListener("keydown", (e) => {
            if (e.code === "KeyF" || e.key === "f" || e.key === "F") {
                e.preventDefault();
                toggleFullScreen();
                return;
            }
            if (isAnimating) {
                return;
            }
            if (e.code === "KeyN" || e.key === "n" || e.key === "N") {
                if (currentState.startsWith("PROGRESS_") || currentState === GAME_STATES.TIMEOUT) {
                    e.preventDefault();
                    const videoElem = document.getElementById("bg-video");
                    videoElem.pause();
                    if (currentState === GAME_STATES.TIMEOUT || !lastAnswerCorrect) {
                        changeState(GAME_STATES.GAMEOVER);
                    } else if (currentState === GAME_STATES.PROGRESS_5) {
                        changeState(GAME_STATES.CLEAR);
                    } else {
                        changeState(GAME_STATES.QUESTION);
                    }
                    return;
                }
            }
            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
            } else {
                return;
            }
            const videoElem = document.getElementById("bg-video");
            if (videoElem.paused && currentMediaVideo) {
                videoElem.play().then(() => videoElem.classList.add("active")).catch(() => {});
            }
            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    questionCount = 0;
                    changeState(GAME_STATES.GENRE);
                }
            }
            else if (currentState === GAME_STATES.GENRE) {
                if (e.code === "Space") {
                    currentGenreIndex = (currentGenreIndex + 1) % GENRE_LIST.length;
                    updateGenreFocus();
                } else if (e.code === "Enter") {
                    isAnimating = true;
                    const chosenIndex = currentGenreIndex;
                    selectedGenre = GENRE_LIST[chosenIndex];
                    animateSelection("genre-cards", ".select-card", chosenIndex, () => {
                        isAnimating = false;
                        changeState(GAME_STATES.DIFFICULTY);
                    });
                }
            }
            else if (currentState === GAME_STATES.DIFFICULTY) {
                if (e.code === "Space") {
                    isAnimating = true;
                    animateSelection("diff-cards", ".select-card", 0, () => {
                        selectedDifficulty = "E";
                        isAnimating = false;
                        questionCount = 0;
                        lastAnswerSide = "L";
                        lastAnswerCorrect = true;
                        changeState(GAME_STATES.PROGRESS);
                    });
                } else if (e.code === "Enter") {
                    isAnimating = true;
                    animateSelection("diff-cards", ".select-card", 1, () => {
                        selectedDifficulty = "H";
                        isAnimating = false;
                        questionCount = 0;
                        lastAnswerSide = "L";
                        lastAnswerCorrect = true;
                        changeState(GAME_STATES.PROGRESS);
                    });
                }
            }
            else if (currentState.startsWith("QUESTION_")) {
                if (e.code === "Space") {
                    clearQuizTimers();
                    isAnimating = true;
                    animateSelection("quiz-options", ".quiz-option-card", 0, () => {
                        isAnimating = false;
                        handleAnswerSubmit("A");
                    });
                } else if (e.code === "Enter") {
                    clearQuizTimers();
                    isAnimating = true;
                    animateSelection("quiz-options", ".quiz-option-card", 1, () => {
                        isAnimating = false;
                        handleAnswerSubmit("B");
                    });
                }
            }
            else if (currentState === GAME_STATES.GAMEOVER) {
                if (isGameOverReady && (e.code === "Enter" || e.code === "Space")) {
                    changeState(GAME_STATES.TITLE);
                }
            }
            else if (currentState === GAME_STATES.CLEAR) {
                if (e.code === "Enter" || e.code === "Space") {
                    changeState(GAME_STATES.TITLE);
                }
            }
        });
       
        // ==========================================================================
        // 6. 初期化（DOM読み込み完了時）
        // ==========================================================================
        window.addEventListener("DOMContentLoaded", () => {
            preloadMedia();
            fetchQuestions();
            changeState(GAME_STATES.TITLE);
            const videoElem = document.getElementById("bg-video");
            videoElem.addEventListener("ended", () => {
                if (currentState.startsWith("PROGRESS_")) {
                    if (!lastAnswerCorrect) {
                        changeState(GAME_STATES.GAMEOVER);
                    } else if (currentState === GAME_STATES.PROGRESS_5) {
                        changeState(GAME_STATES.CLEAR);
                    } else {
                        changeState(GAME_STATES.QUESTION);
                    }
                } else if (currentState === GAME_STATES.TIMEOUT) {
                    changeState(GAME_STATES.GAMEOVER);
                }
            });
        });
    </script>
</head>
<body>
    <!-- 暗転用黒カーテンオーバーレイ -->
    <div id="black-curtain"></div>
    <!-- ネプリーグ風正解テロップオーバーレイ -->
    <div id="correct-overlay" class="hidden">
        <span id="correct-text" class="correct-text">正 解</span>
    </div>
    <!-- 常時右下に表示するロゴ画像 -->
    <img src="media/TrimmedLogo.png" alt="Logo" class="watermark-logo" id="watermark-logo">
    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media" autoplay muted playsinline></video>
    </div>
    <div id="ui-title" class="ui-layer hidden">
        <p class="fullscreen-guide">[ F ]: 全画面表示</p>
        <img src="media/TrimmedLogo.png" alt="WANINT" class="title-logo">
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>
    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="section-title">SELECT GENRE</h2>
        <div id="genre-cards" class="card-container">
            <div class="select-card card-left is-focused">生物</div>
            <div class="select-card card-right">VIVANT</div>
            <div class="select-card card-third">雑学</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>
    <div id="ui-difficulty" class="ui-layer hidden">
        <h2 class="section-title">SELECT DIFFICULTY</h2>
        <div id="diff-cards" class="card-container">
            <div class="select-card card-left">EASY</div>
            <div class="select-card card-right">HARD</div>
        </div>
        <p class="key-guide">[ SPACE ]: 左を選択 / [ ENTER ]: 右を選択</p>
    </div>
    <div id="ui-question" class="ui-layer hidden">
        <div class="quiz-container">
            <div class="quiz-question-box">
                <span id="quiz-text">問題文を取得中...</span>
            </div>
            <div id="quiz-countdown" class="quiz-countdown"></div>
            <div id="quiz-options" class="quiz-options-container">
                <div class="quiz-option-card card-left">
                    <span class="option-label">A [ SPACE ]</span>
                    <span id="opt-a-text" class="option-text">選択肢 A</span>
                </div>
                <div class="quiz-option-card card-right">
                    <span class="option-label">B [ ENTER ]</span>
                    <span id="opt-b-text" class="option-text">選択肢 B</span>
                </div>
            </div>
            <!-- 本家準拠クリア問題インジケーター（画面左下） -->
            <div id="stage-indicator" class="stage-indicator">
                <div class="stage-slot" id="stage-slot-1">1</div>
                <div class="stage-slot" id="stage-slot-2">2</div>
                <div class="stage-slot" id="stage-slot-3">3</div>
                <div class="stage-slot" id="stage-slot-4">4</div>
                <div class="stage-slot" id="stage-slot-5">5</div>
            </div>
        </div>
    </div>
    <div id="ui-gameover" class="ui-layer hidden">
        <h1 class="gameover-title">GAME OVER</h1>
        <p class="start-msg">PRESS ENTER TO TITLE</p>
    </div>
    <div id="ui-clear" class="ui-layer hidden">
        <h1 class="clear-title">CLEARED</h1>
    </div>
</body>
</html>
